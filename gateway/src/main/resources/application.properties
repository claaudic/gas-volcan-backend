spring.application.name=gateway

# El Gateway es la única puerta de entrada para React: todo llega al 8080
# y aquí se reparte a cada microservicio según la ruta.
server.port=${GATEWAY_PORT:8080}

# Dirección de cada microservicio (se pueden cambiar con variables de entorno,
# por ejemplo al desplegar en Docker o en la EC2)
servicios.usuarios=${USUARIOS_URL:http://localhost:8081}
servicios.catalogo=${CATALOGO_URL:http://localhost:8082}
servicios.pedidos=${PEDIDOS_URL:http://localhost:8083}

# --- Rutas ---
# La ruta se reenvía igual: 8080/api/v1/productos/5 -> 8082/api/v1/productos/5.
# El Gateway solo reparte: el token llega intacto y es cada microservicio el que
# revisa el JWT y los permisos (ms-usuarios ya lo hace; catálogo y pedidos, tarjeta 07).
spring.cloud.gateway.server.webflux.routes[0].id=usuarios
spring.cloud.gateway.server.webflux.routes[0].uri=${servicios.usuarios}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/usuarios/**

spring.cloud.gateway.server.webflux.routes[1].id=catalogo
spring.cloud.gateway.server.webflux.routes[1].uri=${servicios.catalogo}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/productos/**,/api/v1/categorias/**

spring.cloud.gateway.server.webflux.routes[2].id=pedidos
spring.cloud.gateway.server.webflux.routes[2].uri=${servicios.pedidos}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/boletas/**

# --- CORS ---
# El navegador ve a React (5173) y al Gateway (8080) como orígenes distintos:
# aquí se autoriza al frontend. Para agregar otro, separarlos con coma.
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ORIGENES:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type

# Los microservicios también responden su propia cabecera CORS (para probarlos solos).
# Si llegan dos, el navegador rechaza la respuesta: se deja una sola.
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
