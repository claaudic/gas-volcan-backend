services:
  mysql:
    image: mysql:8.4
    container_name: volcan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: volcan
      MYSQL_PASSWORD: volcan123
    ports:
      - "3306:3306"
    volumes:
      - volcan-datos:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

volumes:
  volcan-datos:
