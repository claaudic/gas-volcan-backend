spring.application.name=ms-pedidos
server.port=${PEDIDOS_PORT:8083}

# Equipo: MySQL en localhost:3306. Dentro de la red Docker usar PEDIDOS_DB_HOST=mysql.
# Conexion local alternativa: PEDIDOS_DB_PORT=3307.
spring.datasource.url=${PEDIDOS_DB_URL:jdbc:mysql://${PEDIDOS_DB_HOST:localhost}:${PEDIDOS_DB_PORT:3306}/${PEDIDOS_DB_NAME:volcan_pedidos}}
spring.datasource.username=${PEDIDOS_DB_USERNAME:volcan}
spring.datasource.password=${PEDIDOS_DB_PASSWORD:${MYSQL_PASSWORD}}

spring.jpa.hibernate.ddl-auto=${PEDIDOS_DDL_AUTO:update}
spring.jpa.show-sql=${PEDIDOS_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Solo consultas REST; no reservas ni descuentos de existencias.
pedidos.catalogo.url=${PEDIDOS_CATALOGO_URL:http://localhost:8082}
pedidos.usuarios.url=${PEDIDOS_USUARIOS_URL:http://localhost:8081}
pedidos.catalogo.connect-timeout=${PEDIDOS_CATALOGO_CONNECT_TIMEOUT:2s}
pedidos.catalogo.read-timeout=${PEDIDOS_CATALOGO_READ_TIMEOUT:5s}

# Lee las claves de un archivo .env (MYSQL_PASSWORD, JWT_SECRET), si existe.
# Ese archivo NO se sube a GitHub. Ver .env.example.
spring.config.import=optional:file:.env[.properties],optional:file:ms-pedidos/.env[.properties]

# JWT: la misma clave de ms-usuarios (al menos 32 caracteres). No se escribe aquí.
jwt.secret=${JWT_SECRET:}

# Obligatoria, independiente de JWT_SECRET; solo catalogo y pedidos la comparten.
internal.jwt.secret=${INTERNAL_STOCK_JWT_SECRET:}

# Recuperacion durable de compras/compensaciones; mantener habilitada en despliegue.
pedidos.recuperacion.enabled=${PEDIDOS_RECUPERACION_ENABLED:true}
pedidos.recuperacion.intervalo-ms=${PEDIDOS_RECUPERACION_INTERVALO_MS:30000}

# Actuator: solo se muestra /actuator/health ({"status":"UP"}), sin detalles internos.
# Lo usan Docker y el despliegue para saber si el servicio está vivo.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Los errores se documentan por operacion, sin propagar todos los ControllerAdvice.
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
