spring.application.name=ms-catalogo
server.port=${CATALOGO_PORT:8082}

# Equipo: MySQL Docker en localhost:3306; configurar HOST=mysql si la app vive en Docker.
# Conexion local alternativa: CATALOGO_DB_PORT=3307.
spring.datasource.url=${CATALOGO_DB_URL:jdbc:mysql://${CATALOGO_DB_HOST:localhost}:${CATALOGO_DB_PORT:3306}/${CATALOGO_DB_NAME:volcan_catalogo}}
spring.datasource.username=${CATALOGO_DB_USERNAME:volcan}
spring.datasource.password=${CATALOGO_DB_PASSWORD:${MYSQL_PASSWORD}}

spring.jpa.hibernate.ddl-auto=${CATALOGO_DDL_AUTO:update}
spring.jpa.show-sql=${CATALOGO_SHOW_SQL:false}

# Inserta solo faltantes; nunca actualiza precios, stock ni productos existentes.
catalogo.carga-inicial.enabled=${CATALOGO_CARGA_INICIAL_ENABLED:true}

# Lista separada por comas. En otros entornos definir CATALOGO_CORS_ORIGINS.
catalogo.cors.allowed-origins=${CATALOGO_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Lee las claves de un archivo .env (MYSQL_PASSWORD, JWT_SECRET), si existe.
# Ese archivo NO se sube a GitHub. Ver .env.example.
spring.config.import=optional:file:.env[.properties],optional:file:ms-catalogo/.env[.properties]

# JWT: la misma clave de ms-usuarios (al menos 32 caracteres). No se escribe aquí.
jwt.secret=${JWT_SECRET:}

# Obligatoria, independiente de JWT_SECRET; solo catalogo y pedidos la comparten.
internal.jwt.secret=${INTERNAL_STOCK_JWT_SECRET:}

# Actuator: solo se muestra /actuator/health ({"status":"UP"}), sin detalles internos.
# Lo usan Docker y el despliegue para saber si el servicio está vivo.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Los errores se documentan por operacion, sin propagar todos los ControllerAdvice.
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
# UI local: distinguir API de clientes y contrato interno de servicio.
springdoc.swagger-ui.urls[0].name=Catalogo publico
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Stock interno
springdoc.swagger-ui.urls[1].url=/v3/api-docs/stock-interno
