spring.application.name=ms-catalogo
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3307/volcan_catalogo
spring.datasource.username=root
spring.datasource.password=${CATALOGO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activar solo despues de autorizar la carga real.
catalogo.carga-inicial.enabled=false

# Lista separada por comas. En otros entornos definir CATALOGO_CORS_ORIGINS.
catalogo.cors.allowed-origins=${CATALOGO_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
