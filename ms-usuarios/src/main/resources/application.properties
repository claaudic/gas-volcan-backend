spring.application.name=ms-usuarios

# Puerto del microservicio
server.port=8081

# Lee las claves de un archivo .env en la carpeta ms-usuarios, si existe.
# Ese archivo NO se sube a GitHub (.gitignore). Ver .env.example.
# Se busca en los dos lugares desde donde se suele arrancar:
# dentro de ms-usuarios (terminal) o desde gas-volcan-backend (IntelliJ con todo abierto).
spring.config.import=optional:file:.env[.properties],optional:file:ms-usuarios/.env[.properties]

# Conexión a MySQL (contenedor volcan-mysql).
# La contraseña NO se escribe aquí (el repositorio es público): se lee de
# MYSQL_PASSWORD (archivo .env o variable de entorno), la misma que usa ms-catalogo.
# Con Laragon u otro MySQL se pueden cambiar también el usuario y la dirección.
spring.datasource.url=${USUARIOS_DB_URL:jdbc:mysql://localhost:3306/volcan_usuarios}
spring.datasource.username=${USUARIOS_DB_USERNAME:volcan}
spring.datasource.password=${USUARIOS_DB_PASSWORD:${MYSQL_PASSWORD}}

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# La conexión a la base se cierra al terminar el servicio, no al terminar de responder
spring.jpa.open-in-view=false

# No crear el usuario de prueba que Spring Security inventa al arrancar
# (los usuarios están en MySQL y el acceso se controla con JWT)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# JWT: la clave NO se escribe aquí (el repositorio es público). Se lee de JWT_SECRET,
# en el .env o como variable de entorno. Debe ser la misma en los 3 microservicios
# y tener al menos 32 caracteres; si falta, el servicio no arranca.
jwt.secret=${JWT_SECRET:}
# Minutos que dura un token antes de vencer
jwt.expiracion-minutos=30

# CORS: desde qué páginas se puede llamar a esta API (el frontend con Vite).
# Para agregar otra, separarlas con coma o usar la variable de entorno CORS_ORIGENES.
cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Actuator: solo se muestra /actuator/health ({"status":"UP"}), sin detalles internos.
# Lo usan Docker y el despliegue para saber si el servicio está vivo.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Los errores se documentan por operacion, sin propagar todos los ControllerAdvice.
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
