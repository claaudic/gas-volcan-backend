spring.application.name=ms-usuarios

# Puerto del microservicio
server.port=8081

# Conexión a MySQL (contenedor volcan-mysql).
# La contraseña NO se escribe aquí (el repositorio es público): se lee de la
# variable de entorno MYSQL_PASSWORD, la misma que usa ms-catalogo.
# Con Laragon u otro MySQL se pueden cambiar también el usuario y la dirección.
spring.datasource.url=${USUARIOS_DB_URL:jdbc:mysql://localhost:3306/volcan_usuarios}
spring.datasource.username=${USUARIOS_DB_USERNAME:volcan}
spring.datasource.password=${USUARIOS_DB_PASSWORD:${MYSQL_PASSWORD}}

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# La conexión a la base se cierra al terminar el servicio, no al terminar de responder
spring.jpa.open-in-view=false

# No crear el usuario de prueba que Spring Security inventa al arrancar
# (los usuarios están en MySQL y el acceso se controla con JWT)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# JWT: la clave se lee de la variable de entorno JWT_SECRET (la misma en los 2 microservicios).
# Si no existe, usa esta clave SOLO para desarrollo local. Debe tener al menos 32 caracteres.
jwt.secret=${JWT_SECRET:gas-el-volcan-clave-solo-para-desarrollo-local-2026}
# Minutos que dura un token antes de vencer
jwt.expiracion-minutos=30

# CORS: desde qué páginas se puede llamar a esta API (el frontend con Vite).
# Para agregar otra, separarlas con coma o usar la variable de entorno CORS_ORIGENES.
cors.origenes=${CORS_ORIGENES:http://localhost:5173}
